[package]
name = "restem"
version = "1.0.0"
edition = "2021"
description = "ReStem — Fast Bulk File Renamer"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
rfd = "0.15"
regex = "1.11"

[profile.release]
opt-level = "z"       # Максимальная оптимизация размера бинарного файла
lto = true            # Межмодульная оптимизация на этапе линковки
codegen-units = 1     # Плотное сжатие машинного кода
panic = "abort"       # Отключение раскрутки стека для уменьшения веса
strip = true          # Удаление отладочных символов из restem.exe