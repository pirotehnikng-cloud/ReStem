[package]
name = "restem"
version = "1.0.0"
edition = "2021"
description = "ReStem — Fast Bulk File & Folder Renamer"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
rfd = "0.15"
regex = "1.11"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
