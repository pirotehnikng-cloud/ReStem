[package]
name = "restem"
version = "1.3.0"
edition = "2021"
description = "ReStem — Fast Bulk File & Folder Renamer"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/pirotehnikng-cloud/ReStem"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
rfd = "0.15"
regex = "1.11"
trash = "5.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "ico", "gif"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
