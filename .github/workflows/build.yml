name: Build ReStem EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build optimized ReStem EXE
        run: cargo build --release

      - name: Upload compiled EXE to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReStem-Portable
          path: target/release/restem.exe

      - name: Publish EXE to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 target/release/restem.exe --clobber || \
          gh release create v1.0.0 target/release/restem.exe --title "ReStem v1.0.0" --notes "Автономная сборка ReStem для Windows (x64)"
