name: Build ReStem EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build optimized ReStem EXE
        run: cargo build --release

      - name: Upload compiled EXE to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReStem-Portable
          path: target/release/restem.exe

      - name: Publish EXE and Changelog to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" target/release/restem.exe --clobber
            gh release edit "$TAG" --title "ReStem $TAG" --notes-file CHANGELOG.md
          else
            gh release create "$TAG" target/release/restem.exe --title "ReStem $TAG" --notes-file CHANGELOG.md
          fi
