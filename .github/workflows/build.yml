name: Build ReStem EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build optimized ReStem EXE
        run: cargo build --release

      - name: Rename EXE with version from Cargo.toml
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          EXE_NAME="restem_${VERSION}.exe"
          cp target/release/restem.exe "target/release/${EXE_NAME}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "EXE_NAME=${EXE_NAME}" >> "$GITHUB_ENV"

      - name: Upload compiled EXE to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReStem-${{ env.VERSION }}-Portable
          path: target/release/${{ env.EXE_NAME }}

      - name: Publish EXE and Changelog to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "target/release/${EXE_NAME}" --clobber
            gh release delete-asset "$TAG" restem.exe --yes 2>/dev/null || true
            gh release edit "$TAG" --title "ReStem $TAG" --notes-file CHANGELOG.md
          else
            gh release create "$TAG" "target/release/${EXE_NAME}" --title "ReStem $TAG" --notes-file CHANGELOG.md
          fi
